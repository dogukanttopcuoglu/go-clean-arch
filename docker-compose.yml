services:
  db:
    image: postgres:18.6-alpine

    environment:
      POSTGRES_DB: go_clean_arch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d go_clean_arch
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      HTTP_PORT: "8080"
      PG_POOL_MAX: "2"
      PG_URL: "postgres://postgres:postgres@db:5432/go_clean_arch?sslmode=disable"
      JWT_SECRET: "local-development-secret"
      JWT_TOKEN_EXPIRY: "24h"

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: